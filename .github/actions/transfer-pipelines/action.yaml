name: Alterar Diretório das Pipelines
description: "Move as pipelines migradas para um diretório específico no repositório GitHub."

inputs:
  repo:
    description: "Nome do repositório a ser migrado."
    required: true
  gh_pat:
    description: "Token de acesso do GitHub com permissões para criar repositórios e PRs."
    required: true
  gh_org:
    description: "Organização de destino no GitHub."
    required: true

runs:
  using: composite
  steps:
    - name: "Formatar nome do repositório para migração"
      uses: ./.github/actions/normalize-ado-repo-names
      id: normalize-repo
      with:
        ado_repo_name: ${{ inputs.repo }}

    - name: "Configurar GitHub CLI"
      shell: bash
      run: |
        echo ${{ inputs.gh_pat }} | gh auth login --with-token

    - name: "Mover pipelines para .github/workflows/"
      shell: bash
      run: |
        REPO="${{ inputs.gh_org }}/${{ steps.normalize-repo.outputs.repo_name }}"

        # Lista arquivos .yaml/.yml em .pipeline/ via API
        FILES=$(gh api repos/$REPO/contents/.pipeline \
          --jq '[.[] | select(.name | test("\\.(yaml|yml)$")) | .name] | .[]' 2>/dev/null || echo "")

        if [ -z "$FILES" ]; then
          echo "⚠️ Nenhum arquivo de pipeline encontrado em .pipeline/. Pulando etapa."
          exit 0
        fi

        echo "📦 Pipelines encontradas:"
        echo "$FILES"

        echo "$FILES" | while read -r filename; do
          # Busca conteúdo (já em base64) e sha do arquivo original
          FILE_DATA=$(gh api repos/$REPO/contents/.pipeline/$filename)
          CONTENT=$(echo "$FILE_DATA" | jq -r '.content' | tr -d '\n')
          SHA=$(echo "$FILE_DATA" | jq -r '.sha')

          echo "✅ Movendo: .pipeline/$filename → .github/workflows/$filename"

          # Cria em .github/workflows/
          gh api repos/$REPO/contents/.github/workflows/$filename \
            --method PUT \
            -f message="ci: move $filename para .github/workflows/" \
            -f content="$CONTENT"

          # Remove de .pipeline/
          gh api repos/$REPO/contents/.pipeline/$filename \
            --method DELETE \
            -f message="ci: remove $filename de .pipeline/" \
            -f sha="$SHA"
        done