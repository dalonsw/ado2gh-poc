name: Alterar Diretório das Pipelines
description: "Move as pipelines migradas para um diretório específico no repositório GitHub."

inputs:
  repo:
    description: "Nome do repositório a ser migrado."
    required: true
  gh_pat:
    description: "Token de acesso do GitHub com permissões para criar repositórios e PRs."
    required: true

runs:
  using: composite
  steps:
    - name: "Formatar nome do repositório para migração"
      uses: ./.github/actions/normalize-ado-repo-names
      id: normalize-repo
      with:
        ado_repo_name: ${{ inputs.repo }}

    - name: "Configurar GitHub CLI"
      shell: bash
      run: |
        echo ${{ inputs.gh_pat }} | gh auth login --with-token

    - name: "Mover pipelines para o diretório .github/workflows/"
      shell: bash
      working-directory: target-repo
      run: |
        mkdir -p .github/workflows/

        PIPELINE_FILES=$(find .pipeline/ \
          \( -name '*.yaml' -o -name '*.yml' \) \
          2>/dev/null)

        if [ -z "$PIPELINE_FILES" ]; then
          echo "⚠️ Nenhum arquivo de pipeline encontrado. Pulando etapa."
          exit 0
        fi

        echo "📦 Pipelines encontradas:"
        echo "$PIPELINE_FILES"

        echo "$PIPELINE_FILES" | while read -r file; do
          mv "$file" .github/workflows/
          echo "✅ Movido: $file → .github/workflows/$(basename $file)"
        done

        rm -rf .pipeline/

        git add .github/workflows/ .pipeline/
        git diff --cached --quiet || git commit -m "ci: move pipelines migradas para .github/workflows"
        git push origin main