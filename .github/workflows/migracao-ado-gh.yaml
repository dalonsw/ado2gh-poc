name: "Migração de repos do Azure DevOps para GitHub"

env:
  GH_PAT: ${{ secrets.TARGET_TOKEN }}
  ADO_PAT: ${{ secrets.SOURCE_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      ado_org:
        description: "Organização do Azure DevOps"
        required: true
        default: ""
        type: string
      target_org:
        description: "Organização de destino no GitHub"
        required: true
        default: ""
        type: string
      ado_team_project:
        description: "Projeto contendo os repos a serem migrados"
        required: true
        default: "nome_do_projeto"
        type: string
      ado_repo_list:
        description: "Lista de repos do Azure DevOps (separados por vírgula)"
        required: true
        default: "repo1,repo2,repo3"
        type: string

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix-repos: ${{ steps.set-matrix.outputs.repos }}
    steps:
      - name: "Configurar matriz de Repos"
        id: set-matrix
        run: |
          repos_json=$(echo "${{ github.event.inputs.ado_repo_list }}" | tr -d ' ' | tr ',' '\n' | jq -R . | jq -s -c .)
          echo "repos=$repos_json" >> $GITHUB_OUTPUT
  
  migrate-projects:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repos: ${{ fromJson(needs.setup-matrix.outputs.matrix-repos) }}
      fail-fast: false
    steps:
      - name: "Configure Migrator Role ADO2GH"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-ado2gh
          gh ado2gh grant-migrator-role --actor ${{ github.actor }} --actor-type USER --github-org ${{ github.event.inputs.target_org }}

      - name: "Migrar repo ${{ matrix.repos }} do projeto ${{ github.event.inputs.ado_team_project }}"
        run: |
          echo "Migrando repo: ${{ matrix.repos }}" 
          gh ado2gh migrate-repo \
          --ado-org "${{ github.event.inputs.ado_org }}" \
          --ado-team-project "${{ github.event.inputs.ado_team_project }}" \
          --ado-repo ${{ matrix.repos }} \
          --github-org ${{ github.event.inputs.target_org }} \
          --github-repo ${{ matrix.repos }}

      - name: Arquivar repo ${{ matrix.repos }} no Azure DevOps
        if: success()
        run: |
          echo "Desabilitando repositório no Azure DevOps..."
          REPO_ID=$(curl -sf \
            -H "Authorization: Basic $(echo -n ":$ADO_PAT" | base64 -w0)" \
            "https://dev.azure.com/${{ github.event.inputs.ado_org }}/${{ github.event.inputs.ado_team_project }}/_apis/git/repositories/${{ matrix.repos }}?api-version=7.1" \
            | jq -r '.id')
          curl -sf -X PATCH \
            -H "Authorization: Basic $(echo -n ":$ADO_PAT" | base64 -w0)" \
            -H "Content-Type: application/json" \
            "https://dev.azure.com/${{ github.event.inputs.ado_org }}/${{ github.event.inputs.ado_team_project }}/_apis/git/repositories/$REPO_ID?api-version=7.1" \
            -d '{"isDisabled": true}'

      - name: "Relatório de migração"
        if: always()
        run: echo "${{ matrix.repos }},${{ job.status }}" > status.txt

      - name: "Publicar relatório"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "status-${{ matrix.repos }}"
          path: status.txt

  configure-metadata:
    needs: [setup-matrix, migrate-projects]
    runs-on: ubuntu-latest
    if: success()
    strategy:
      matrix:
        repos: ${{ fromJson(needs.setup-matrix.outputs.matrix-repos) }}
    steps:
      - name: "Configurar GH CLI"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          gh auth login --with-token < ${{ secrets.TARGET_TOKEN }}

      - name: "Configurar metadata dos repositórios migrados"
        run: |
          gh repo edit ${{ github.event.inputs.target_org }}/${{ matrix.repos }} --topic ${{ inputs.ado_team_project }} --description "Migrado do Azure DevOps - Projeto: ${{ github.event.inputs.ado_team_project }}"

      - name: "Configurar branch principal"
        run: |
          gh repo edit ${{ github.event.inputs.target_org }}/${{ matrix.repos }} --default-branch main

      - name: "Criar CODEOWNERS"
        run: |
          echo ".github/* @${{ github.event.inputs.target_org }}/grp-corporate-sre-base" > CODEOWNERS
          echo "* @${{ github.event.inputs.target_org }}/grp-corporate-${{ github.event.inputs.ado_team_project }}-maintainers" >> CODEOWNERS

          gh repo upload ${{ github.event.inputs.target_org }}/${{ matrix.repos }} CODEOWNERS --repo ${{ github.event.inputs.target_org }}/${{ matrix.repos }} --message "Add CODEOWNERS file"
        
      - name: "Criar PR Template"
        run: |
          mkdir -p .github
          echo "# Descrição" > .github/pull_request_template.md
          echo "Descreva as mudanças propostas neste PR." >> .github/pull_request_template.md
          echo "" >> .github/pull_request_template.md
          echo "## Tipo de mudança" >> .github/pull_request_template.md
          echo "- [ ] Bug fix (correção de um problema)" >> .github/pull_request_template.md
          echo "- [ ] Nova funcionalidade (adição de uma funcionalidade)" >> .github/pull_request_template.md
          echo "- [ ] Melhoria (melhoria de uma funcionalidade existente)" >> .github/pull_request_template.md
          echo "- [ ] Refatoração (alteração de código sem adicionar ou corrigir funcionalidades)" >> .github/pull_request_template.md
          echo "- [ ] Documentação (adição ou atualização de documentação)" >> .github/pull_request_template.md
          echo "- [ ] Outro (especifique)" >> .github/pull_request_template.md

          gh repo upload ${{ github.event.inputs.target_org }}/${{ matrix.repos }} .github/pull_request_template.md --repo ${{ github.event.inputs.target_org }}/${{ matrix.repos }} --message "Add PR template" 

  relatorio-final:
    needs: migrate-projects
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Baixar relatórios de migração"
        uses: actions/download-artifact@v4
        with:
          path: migration-statuses

      - name: Gerar relatório
        run: |
          echo "# Relatório de Migração ADO para GH" >> $GITHUB_STEP_SUMMARY
          find migration-statuses -name 'status.txt' -exec cat {} + | while IFS=, read -r repo status; do
            if [ "$status" == "success" ]; then
              echo "- ✅ $repo" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ $repo" >> $GITHUB_STEP_SUMMARY
            fi
          done
