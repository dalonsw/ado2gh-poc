name: "Migração de repos do Azure DevOps para GitHub"

env:
  GH_PAT: ${{ secrets.TARGET_TOKEN }}
  ADO_PAT: ${{ secrets.SOURCE_TOKEN }}

on:
  workflow_dispatch:
    inputs:
      ado_org:
        description: "Organização do Azure DevOps"
        required: true
        default: ""
        type: string
      target_org:
        description: "Organização de destino no GitHub"
        required: true
        default: ""
        type: string
      ado_team_project:
        description: "Projeto contendo os repos a serem migrados"
        required: true
        default: "nome_do_projeto"
        type: string
      ado_repo_list:
        description: "Lista de repos do Azure DevOps (separados por vírgula)"
        required: true
        default: "repo1,repo2,repo3"
        type: string

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix-repos: ${{ steps.set-matrix.outputs.repos }}
    steps:
      - name: "Configurar matriz de Repos"
        id: set-matrix
        run: |
          repos_json=$(echo "${{ github.event.inputs.ado_repo_list }}" | tr -d ' ' | tr ',' '\n' | jq -R . | jq -s -c .)
          echo "repos=$repos_json" >> $GITHUB_OUTPUT
  
  migrate-projects:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repos: ${{ fromJson(needs.setup-matrix.outputs.matrix-repos) }}
      fail-fast: false
    steps:
      - name: "Migrar repo ${{ matrix.repos }} via git mirror"
        run: |
          echo "Migrando repo: ${{ matrix.repos }}"
 
          # Clona espelho do ADO usando o PAT na URL
          git clone --mirror \
            "https://anything:${{ secrets.SOURCE_TOKEN }}@dev.azure.com/${{ github.event.inputs.ado_org }}/${{ github.event.inputs.ado_team_project }}/_git/${{ matrix.repos }}" \
            "${{ matrix.repos }}.git"
 
          cd "${{ matrix.repos }}.git"
 
          # Aponta origin para o repo já existente no GitHub
          git remote set-url origin \
            "https://x-access-token:${{ secrets.TARGET_TOKEN }}@github.com/${{ github.event.inputs.target_org }}/${{ matrix.repos }}.git"
 
          # Push de todas as branches, tags e refs
          git push --mirror


      - name: Arquivar repo ${{ matrix.repos }} no Azure DevOps
        if: success()
        run: |
          echo "Desabilitando repositório no Azure DevOps..."
          REPO_ID=$(curl -sf \
            -H "Authorization: Basic $(echo -n ":$ADO_PAT" | base64 -w0)" \
            "https://dev.azure.com/${{ github.event.inputs.ado_org }}/${{ github.event.inputs.ado_team_project }}/_apis/git/repositories/${{ matrix.repos }}?api-version=7.1" \
            | jq -r '.id')
          curl -sf -X PATCH \
            -H "Authorization: Basic $(echo -n ":$ADO_PAT" | base64 -w0)" \
            -H "Content-Type: application/json" \
            "https://dev.azure.com/${{ github.event.inputs.ado_org }}/${{ github.event.inputs.ado_team_project }}/_apis/git/repositories/$REPO_ID?api-version=7.1" \
            -d '{"isDisabled": true}'

      - name: "Relatório de migração"
        if: always()
        run: echo "${{ matrix.repos }},${{ job.status }}" > status.txt

      - name: "Publicar relatório"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "status-${{ matrix.repos }}"
          path: status.txt

  configure-metadata:
    needs: [setup-matrix, migrate-projects]
    runs-on: ubuntu-latest
    if: success()
    strategy:
      matrix:
        repos: ${{ fromJson(needs.setup-matrix.outputs.matrix-repos) }}
    steps:
      - name: "Configurar GitHub CLI"
        run: |
          echo ${{ secrets.TARGET_TOKEN }} | gh auth login --with-token

      - name: "Configurar metadata dos repositórios migrados"
        run: |
          gh repo edit ${{ github.event.inputs.target_org }}/${{ matrix.repos }} --add-topic ${{ inputs.ado_team_project }} --description "Migrado do Azure DevOps - Projeto: ${{ github.event.inputs.ado_team_project }}"

      - name: "Configurar branch principal"
        run: |
          gh repo edit ${{ github.event.inputs.target_org }}/${{ matrix.repos }} --default-branch main

      - name: "Criar CODEOWNERS"
        run: |
          CONTENT=$(printf ".github/* @${{ github.event.inputs.target_org }}/grp-corporate-sre-base\n* @${{ github.event.inputs.target_org }}/grp-corporate-${{ github.event.inputs.ado_team_project }}-maintainers" | base64 -w0)
          gh api repos/${{ github.event.inputs.target_org }}/${{ matrix.repos }}/contents/.github/CODEOWNERS \
            --method PUT \
            -f message="Add CODEOWNERS file" \
            -f content="$CONTENT"
        
      - name: "Criar PR Template"
        run: |
          CONTENT=$(printf "# Descrição\nDescreva as mudanças propostas neste PR.\n\n## Tipo de mudança\n- [ ] Bug fix (correção de um problema)\n- [ ] Nova funcionalidade (adição de uma funcionalidade)\n- [ ] Melhoria (melhoria de uma funcionalidade existente)\n- [ ] Refatoração (alteração de código sem adicionar ou corrigir funcionalidades)\n- [ ] Documentação (adição ou atualização de documentação)\n- [ ] Outro (especifique)" | base64 -w0)
          gh api repos/${{ github.event.inputs.target_org }}/${{ matrix.repos }}/contents/.github/pull_request_template.md \
            --method PUT \
            -f message="Add PR template" \
            -f content="$CONTENT"

  relatorio-final:
    needs: migrate-projects
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Baixar relatórios de migração"
        uses: actions/download-artifact@v4
        with:
          path: migration-statuses

      - name: Gerar relatório
        run: |
          echo "# Relatório de Migração ADO para GH" >> $GITHUB_STEP_SUMMARY
          find migration-statuses -name 'status.txt' -exec cat {} + | while IFS=, read -r repo status; do
            if [ "$status" == "success" ]; then
              echo "- ✅ $repo" >> $GITHUB_STEP_SUMMARY
            else
              echo "- ❌ $repo" >> $GITHUB_STEP_SUMMARY
            fi
          done
